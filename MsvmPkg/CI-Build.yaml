name: $(SourceBranchName)_$(Date:yyyyMMdd_HHmmss)$(Rev:.r)

resources:
- repo: self
  clean: true

pool:
  name: Hosted VS2017

strategy:
  maxParallel: 4
  matrix:
    TARGET_DEBUG_X64:
      Build.Target: 'DEBUG'
      Build.Arch: 'x64'
    TARGET_RELEASE_x64:
      Build.Target: 'RELEASE'
      Build.Arch: 'x64'
    TARGET_DEBUG_AARCH64:
      Build.Target: 'DEBUG'
      Build.Arch: 'AARCH64'
    TARGET_RELEASE_AARCH64:
      Build.Target: 'RELEASE'
      Build.Arch: 'AARCH64'

workspace:
  clean: all

variables:
  Build.ToolChainTag: "VS2017"
  PlatformPkg: "MsvmPkg"
  Env.PythonVersion: "3.7.2"
  GIT_TERMINAL_PROMPT: "0"

  BuildIdentifier: $(Build.BuildNumber)

  #parameters for vpack publishing
  Parameters.vPack.pushPkgName: "$(Build.Repository.Name).mscoreuefi.$(Build.Arch).$(Build.Target)"
  Parameters.vPack.majorVer: "21"
  Parameters.vPack.minorVer: "0"

steps:
- checkout: self
  clean: true

- powershell: |
   git config --file=.gitmodules submodule.Common/MSCORE_INTERNAL.url "https://user:$(WP.PAT)@dev.azure.com/windowspartners/MSCoreUEFI/_git/Core_UEFI_Internal"
   git config --file=.gitmodules submodule.Common/MU_TIANO.url "https://user:$(OS.PAT)@dev.azure.com/microsoft/OS/_git/hyperv.uefi.mu_tiano_plus"
   git config --file=.gitmodules submodule.MU_BASECORE.url "https://user:$(OS.PAT)@dev.azure.com/microsoft/OS/_git/hyperv.uefi.mu_basecore"
   git submodule sync

  displayName: 'Use PATs for submodules'

- task: PkgESInstallNuGetToolsPackage@10
  displayName: 'Install Python'
  inputs:
    packageName: python
    packageVersion: '$(Env.PythonVersion)'
    packageSources: 'https://api.nuget.org/v3/index.json'
    subPaths: tools

- task: CmdLine@1
  displayName: 'Add mu_build pip'
  inputs:
    filename: python.exe
    arguments: '-m pip install --upgrade -r pip_requirement_stable.txt --force-reinstall --no-cache-dir'

- task: NuGetAuthenticate@0
  inputs:
    nuGetServiceConnections: WindowsPartnersNugetFeedConnection
    
- task: CmdLine@1
  displayName: 'Platform build Setup'
  inputs:
    filename: python.exe
    arguments: '$(PlatformPkg)/PlatformBuild.py --setup'

- task: CmdLine@1
  displayName: 'Platform build Update'
  inputs:
    filename: python.exe
    arguments: '$(PlatformPkg)/PlatformBuild.py --update'

- task: CmdLine@1
  displayName: 'Run Build '
  inputs:
    filename: python.exe
    arguments: '$(PlatformPkg)/PlatformBuild.py  tool_chain_tag=$(Build.ToolChainTag) BUILDREPORTING=TRUE BUILDREPORT_TYPES="PCD DEPEX FLASH BUILD_FLAGS LIBRARY" TARGET=$(Build.Target) BUILD_ARCH=$(Build.Arch) BLD_*_DEBUG_NOISY=1 BLD_*_DEBUGLIB_SERIAL=1 LaunchLogOnSuccess=FALSE LaunchLogOnError=FALSE'

# Copy the build logs to the artifact staging directory
- task: CopyFiles@2
  displayName: "Copy build logs"
  inputs:
    targetFolder: "$(Build.ArtifactStagingDirectory)"
    SourceFolder: "Build"
    contents: |
      BuildLog.txt
      BUILDLOG_*.txt
      BUILDLOG_*.md
      **/BUILD_REPORT.txt
      CI_*.txt
      CI_*.md
      CISETUP.txt
      SETUPLOG.txt
      UPDATE_LOG.txt
      PREVALLOG.txt
      TestSuites.xml
      **/BUILD_TOOLS_REPORT.html
      **/OVERRIDELOG.TXT
      BASETOOLS_BUILD*.*
      **/FD_REPORT.HTML
    flattenFolders: true
  condition: succeededOrFailed()

# Publish build artifacts to Azure Artifacts/TFS or a file share
- task: PublishBuildArtifacts@1
  continueOnError: true
  displayName: "Publish build logs"
  inputs:
    pathtoPublish: "$(Build.ArtifactStagingDirectory)"
    artifactName: "Build Logs $(System.JobName)"
  condition: succeededOrFailed()

- task: PublishBuildArtifacts@1
  displayName: 'Publish Artifact: Firmware Bin File $(Build.Target)_$(Build.Arch)'
  inputs:
    PathtoPublish: 'Build/Msvm$(Build.Arch)/$(Build.Target)_$(Build.ToolChainTag)/FV/Msvm.fd'
    ArtifactName: 'Firmware Binary File $(Build.Target)_$(Build.Arch)'

- task: PublishBuildArtifacts@1
  displayName: 'Publish Artifact: Firmware PDB Files $(Build.Target)_$(Build.Arch)'
  inputs:
    PathtoPublish: 'Build/Msvm$(Build.Arch)/$(Build.Target)_$(Build.ToolChainTag)/PDB/'
    ArtifactName: 'Firmware PDB Files $(Build.Target)_$(Build.Arch)'

- task: PublishBuildArtifacts@1
  displayName: 'Publish Artifact: Firmware Map Files $(Build.Target)_$(Build.Arch)'
  inputs:
    PathtoPublish: 'Build/Msvm$(Build.Arch)/$(Build.Target)_$(Build.ToolChainTag)/MAP/'
    ArtifactName: 'Firmware Map Files $(Build.Target)_$(Build.Arch)'

- task: PublishSymbols@2
  inputs:
    SearchPattern: 'Build/Msvm$(Build.Arch)/$(Build.Target)_$(Build.ToolChainTag)/PDB/*.pdb'
    IndexSources: false
    SymbolServerType: 'TeamServices'
    SymbolsProduct: 'Hyper-V UEFI'
  continueOnError: true

- powershell: |
   $LocalCommit = & 'git' rev-parse "@"
   Write-Host "##vso[task.setvariable variable=Build.CommitHash]$LocalCommit"
   $folder = "$(Build.SourcesDirectory)/Build/Msvm$(Build.Arch)/$(Build.Target)_$(Build.ToolChainTag)/Bin"
   New-Item $folder -Type Directory
   copy-item "Build/Msvm$(Build.Arch)/$(Build.Target)_$(Build.ToolChainTag)/FV/Msvm.fd" $folder
   copy-item "Build/Msvm$(Build.Arch)/$(Build.Target)_$(Build.ToolChainTag)/PDB" $folder -Recurse
   copy-item "Build/Msvm$(Build.Arch)/$(Build.Target)_$(Build.ToolChainTag)/$(Build.Arch)/MsvmPkg/AcpiTables/AcpiTables/OUTPUT/Dsdt.aml" $folder
   Write-Host "##vso[task.setvariable variable=vPack.Folder]$folder"

  displayName: 'Compute Hash and Copy firmware to vpack folder'

- task: PkgESVPack@12
  displayName: PkgESVPack
  inputs:
    versionAs: parts
    sourceDirectory: '$(vPack.Folder)'
    description: 'Hyper V UEFI Firmware'
    pushPkgName: '$(Parameters.vPack.pushPkgName)'
    majorVer: '$(Parameters.vPack.majorVer)'
    minorVer: '$(Parameters.vPack.minorVer)'
    metadata: '$(Build.CommitHash)'

- task: NuGetCommand@2
  displayName: 'Pack the NuGet package'
  inputs:
    command: 'pack'
    packagesToPack: '$(PlatformPkg)/HyperVUefi.NuSpec'
    packDestination: '$(Build.ArtifactStagingDirectory)'
    packTimezone: 'utc'
    buildProperties: 'id=$(Build.Repository.Name).mscoreuefi.$(Build.Arch).$(Build.Target)_$(BuildIdentifier);version=$(Parameters.vPack.majorVer).$(Parameters.vPack.minorVer)'

- task: NuGetCommand@2
  displayName: 'Push the NuGet package to the HyperVUefi feed'
  inputs:
    command: 'push'
    packagesToPush: '$(Build.StagingDirectory)/**/*.nupkg'
    feedsToUse: 'config'
    nugetConfigPath: '$(PlatformPkg)/NuGet.config'
    publishVstsFeed: 'OS/HyperVUefi'

- powershell: |
   git config --file=.gitmodules submodule.Common/MSCORE_INTERNAL.url "https://dev.azure.com/windowspartners/MSCoreUEFI/_git/Core_UEFI_Internal"
   git config --file=.gitmodules submodule.Common/PRM.url "https://dev.azure.com/windowspartners/MSCoreUEFI/_git/platform_runtime_mechanism"
   git config --file=.gitmodules submodule.Common/MU_TIANO.url "https://dev.azure.com/microsoft/OS/_git/hyperv.uefi.mu_tiano_plus"
   git config --file=.gitmodules submodule.MU_BASECORE.url "https://dev.azure.com/microsoft/OS/_git/hyperv.uefi.mu_basecore"
   git submodule sync

  displayName: 'Restore Submodules'
  condition: always()
