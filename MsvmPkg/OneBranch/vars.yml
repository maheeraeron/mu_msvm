#
# This is a "template", a unit of reuse.
#
# https://aka.ms/obpipelines/variables

variables:
  Parameters.vPack.majorVer: "25"
  Parameters.vPack.minorVer: "0"
  #
  # Nuget packages.
  #
  # Emulate CoreXT. TODO: Better factoring/automation.
  #
  # Specifically $(PkgFoo) is the path to package Foo.
  # Ideally we would only list names and versions, as in corext.config, and not form the path here.
  #
  Pkg:                      $(System.ArtifactsDirectory)\pkg
  TerrapinVer:              8.0.0-105383472
  PkgTerrapinRetrievalTool: $(Pkg)\TerrapinRetrievalTool.$(TerrapinVer)
  STUART_EXTDEP_CACHE_PATH: $(Pkg)
  TerrapinStore:            https://vcpkg.storage.devpackages.microsoft.io/artifacts
  #
  # Terrapin downloads to Stuart ExtDep cache.
  # URLs from CI logs.
  # Paths are derived from local builds.
  # Hashes are from wsl sha512sum.
  # Files are manually downloaded locally and manually uploaded to https://devpackages.microsoft.io/vcpkg
  # TODO: Automate.
  #
  BaseToolsUrl:  https://github.com/microsoft/mu_basecore/releases/download/v2025020001.0.5/basetools-v2025020001.0.5.tar.gz
  BaseToolsHash: 62e5b4213ecbfe2a56ce73a58fbe26c9594b7ebd78436cb5da98ea0603c71903581e393f23c6f419aa2fd47a34da992f67cc0314243e02a2191d739f1877c6b0
  BaseToolsPath: web\Mu-Basetools\ab722c48403568994f2583019deff53b5451f38b
  #
  MuCryptoUrl:   https://github.com/microsoft/mu_crypto_release/releases/download/v1.1.2/Mu_CryptoBin_v1_1_2.zip
  MuCryptoHash:  b769e7cf5c86ccdb3912587cc32d9cb30774cc9f88d7ac4b3271559803b58a5aeebbd8638677771b79c7cd1b05a5e8d5b708496a7dd8c6196bb919dd7303580f
  MuCryptoPath:  web\edk2-basecrypto-driver-bin\0770383bbac3e263dc1f1fa90b0e1abae21afb92

  # Variables cannot be objects.
  # Nugets: [{name: TerrapinRetrievalTool, version: $(TerrapinVer)}]
  #
  # Terrapins: [
  #   {name: MuCrypto,  url: $(MuCryptoUrl),  path: $(MuCryptoPath),  hash: $(MuCryptoHash)},
  #   {name: BaseTools, url: $(BaseToolsUrl), path: $(BaseToolsPath), hash: $(BaseToolsHash)}]
