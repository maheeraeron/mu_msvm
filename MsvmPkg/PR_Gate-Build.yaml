resources:
- repo: self
  clean: true

pool:
  name: Package ES Custom Demands Lab A
  demands:
  - ClientAlias -equals sebrogan  # specific string

strategy:
  maxParallel: 4
  matrix:
    TARGET_DEBUG_X64:
      Build.Target: 'DEBUG'
      Build.Arch: 'x64'
    TARGET_RELEASE_x64:
      Build.Target: 'RELEASE'
      Build.Arch: 'x64'
    TARGET_DEBUG_AARCH64:
      Build.Target: 'DEBUG'
      Build.Arch: 'AARCH64'
    TARGET_RELEASE_AARCH64:
      Build.Target: 'RELEASE'
      Build.Arch: 'AARCH64'

variables:
  Build.ToolChainTag: "VSLATESTx86xASL"
  PlatformPkg: "MsvmPkg"
  Env.PythonVersion: "3.7.0"

steps:

- powershell: |
   @{
   SM_UDK_INTERNAL = "https://user:$(WP.PAT)@windowspartners.visualstudio.com/MSCoreUEFI/_git/Core_UEFI_Internal";
   SM_UDK = "https://user:$(MSCORE.PAT)@microsoft.visualstudio.com/DefaultCollection/MsUEFI/_git/CORE";
   }.GetEnumerator() | % {
     $SM = $_.Key; $URL = $_.Value
     git config --file=.gitmodules submodule.${SM}.url ${URL}
   }
   git submodule sync

  displayName: 'Use PATs for submodules'

- task: PkgESInstallNuGetToolsPackage@10
  displayName: 'Install Python'
  inputs:
    packageName: python
    packageVersion: '$(Env.PythonVersion)'
    packageSources: 'https://api.nuget.org/v3/index.json'
    subPaths: tools

- task: CmdLine@1
  displayName: 'Platform build Setup'
  inputs:
    filename: python.exe
    arguments: 'MsvmPkg/PlatformBuild.py --setup --force'
 
- task: CmdLine@1
  displayName: 'Platform build Update'
  inputs:
    filename: python.exe
    arguments: 'MsvmPkg/PlatformBuild.py --update'

- task: CmdLine@1
  displayName: 'Run Build '
  inputs:
    filename: python.exe
    arguments: 'MsvmPkg/PlatformBuild.py  tool_chain_tag=$(Build.ToolChainTag) BUILDREPORTING=TRUE BUILDREPORT_TYPES="PCD DEPEX FLASH BUILD_FLAGS LIBRARY" TARGET=$(Build.Target) BUILD_ARCH=$(Build.Arch)'

- task: PublishBuildArtifacts@1
  displayName: 'Publish Artifact: BuildLog $(Build.Target) $(Build.Arch)'
  inputs:
    PathtoPublish: Build/BuildLog.txt
    ArtifactName: 'BuildLog_$(Build.Target)_$(Build.Arch)'
  condition: succeededOrFailed()

- task: PublishBuildArtifacts@1
  displayName: 'Publish Artifact: Firmware Bin File $(Build.Target)_$(Build.Arch)'
  inputs:
    PathtoPublish: 'Build/Msvm$(Build.Arch)/$(Build.Target)_$(Build.ToolChainTag)/FV/Msvm.fd'
    ArtifactName: 'Firmware Binary File $(Build.Target)_$(Build.Arch)'

- task: PublishBuildArtifacts@1
  displayName: 'Publish Artifact: OverrideLog $(Build.Target)_$(Build.Arch)'
  inputs:
    PathtoPublish: Build/Msvm$(Build.Arch)/$(Build.Target)_$(Build.ToolChainTag)/OVERRIDELOG.TXT
    ArtifactName: 'OverrideLog $(Build.Target)_$(Build.Arch)'
  continueOnError: true
  condition: succeededOrFailed()

- task: PublishBuildArtifacts@1
  displayName: 'Publish Artifact: Build Report $(Build.Target)_$(Build.Arch)'
  inputs:
    PathtoPublish: Build/Msvm$(Build.Arch)/$(Build.Target)_$(Build.ToolChainTag)/BUILD_REPORT.txt
    ArtifactName: 'Build Report $(Build.Target)_$(Build.Arch)'
  continueOnError: true

- task: PublishBuildArtifacts@1
  displayName: 'Publish Artifact: Firmware Size Report $(Build.Target)_$(Build.Arch)'
  inputs:
    PathtoPublish: Build/Msvm$(Build.Arch)/$(Build.Target)_$(Build.ToolChainTag)/FD_REPORT.HTML
    ArtifactName: 'Firmware Size Report $(Build.Target)_$(Build.Arch)'
  continueOnError: true

- powershell: |
   @{
   SM_UDK_INTERNAL = "https://windowspartners.visualstudio.com/MSCoreUEFI/_git/Core_UEFI_Internal";
   SM_UDK = "https://microsoft.visualstudio.com/DefaultCollection/MsUEFI/_git/CORE";
   }.GetEnumerator() | % {
     $SM = $_.Key; $URL = $_.Value
     git config --file=.gitmodules submodule.${SM}.url ${URL}
   }
   git submodule sync

  displayName: 'Restore Submodules'
  condition: always()
